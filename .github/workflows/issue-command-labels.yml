name: Label command issues

on:
  issues:
    types: [opened]

permissions:
  issues: write

jobs:
  label:
    if: >-
      github.repository == 'nunomaduro/dev-null.sh' &&
      (endsWith(github.event.issue.body, '<!-- dev-null-command:feature -->') ||
       endsWith(github.event.issue.body, '<!-- dev-null-command:bug -->'))
    runs-on: ubuntu-latest
    steps:
      - name: Apply command label
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          LABEL: ${{ endsWith(github.event.issue.body, '<!-- dev-null-command:feature -->') && 'enhancement' || 'bug' }}
        run: gh issue edit "$ISSUE_NUMBER" --repo "$GH_REPO" --add-label "$LABEL"
